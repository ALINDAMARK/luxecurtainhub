<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="luxeFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6f5f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e6e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="velvet1" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#d4aa6e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9975e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8945a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="velvet2" x1="100%" y1="0%" x2="0%">
      <stop offset="0%" style="stop-color:#b8945a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9975e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4aa6e;stop-opacity:0.95" />
    </linearGradient>
    <filter id="depth">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="url(#luxeFade)"/>
  
  <!-- Decorative corner elements -->
  <circle cx="15" cy="15" r="2" fill="#b8945a" opacity="0.3"/>
  <circle cx="185" cy="15" r="2" fill="#b8945a" opacity="0.3"/>
  <circle cx="15" cy="185" r="2" fill="#b8945a" opacity="0.3"/>
  <circle cx="185" cy="185" r="2" fill="#b8945a" opacity="0.3"/>
  
  <!-- Room frame -->
  <path d="M 30 30 L 30 170 L 170 170 L 170 30 Z" fill="none" stroke="#b8945a" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Interior wall suggestion -->
  <rect x="30" y="30" width="140" height="140" fill="#faf9f7" opacity="0.5"/>
  
  <!-- Left curtain - large decorative folds -->
  <g filter="url(#depth)">
    <path d="M 32 35 
             L 32 165
             Q 30 170 38 170
             L 80 170
             Q 85 168 83 160
             L 85 38
             Q 87 35 80 35
             Z" fill="url(#velvet1)"/>
    
    <!-- Deep pleat details -->
    <path d="M 42 40 Q 40 70 42 100 Q 40 130 42 165" stroke="#1f1a17" stroke-width="1.5" opacity="0.25" fill="none" stroke-linecap="round"/>
    <path d="M 52 40 Q 50 70 52 100 Q 50 130 52 165" stroke="#1f1a17" stroke-width="1.2" opacity="0.2" fill="none" stroke-linecap="round"/>
    <path d="M 62 40 Q 60 70 62 100 Q 60 130 62 165" stroke="#1f1a17" stroke-width="0.8" opacity="0.15" fill="none" stroke-linecap="round"/>
    <path d="M 72 40 Q 70 70 72 100 Q 70 130 72 165" stroke="#1f1a17" stroke-width="0.8" opacity="0.1" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Right curtain - mirror folds -->
  <g filter="url(#depth)">
    <path d="M 168 35
             L 168 165
             Q 170 170 162 170
             L 120 170
             Q 115 168 117 160
             L 115 38
             Q 113 35 120 35
             Z" fill="url(#velvet2)"/>
    
    <!-- Deep pleat details -->
    <path d="M 158 40 Q 160 70 158 100 Q 160 130 158 165" stroke="#1f1a17" stroke-width="1.5" opacity="0.25" fill="none" stroke-linecap="round"/>
    <path d="M 148 40 Q 150 70 148 100 Q 150 130 148 165" stroke="#1f1a17" stroke-width="1.2" opacity="0.2" fill="none" stroke-linecap="round"/>
    <path d="M 138 40 Q 140 70 138 100 Q 140 130 138 165" stroke="#1f1a17" stroke-width="0.8" opacity="0.15" fill="none" stroke-linecap="round"/>
    <path d="M 128 40 Q 130 70 128 100 Q 130 130 128 165" stroke="#1f1a17" stroke-width="0.8" opacity="0.1" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Elegant curtain rod with finials -->
  <rect x="32" y="33" width="136" height="3.5" rx="1.75" fill="#1f1a17"/>
  <rect x="32" y="33" width="136" height="2" rx="1" fill="#d4aa6e" opacity="0.8"/>
  
  <!-- Decorative finials -->
  <circle cx="36" cy="34.75" r="4" fill="#1f1a17"/>
  <circle cx="36" cy="34.75" r="2.5" fill="#d4aa6e" opacity="0.7"/>
  <circle cx="164" cy="34.75" r="4" fill="#1f1a17"/>
  <circle cx="164" cy="34.75" r="2.5" fill="#d4aa6e" opacity="0.7"/>
  
  <!-- Center light opening -->
  <ellipse cx="100" cy="100" rx="20" ry="30" fill="#fff5eb" opacity="0.5"/>
  
  <!-- Window pane suggestion -->
  <rect x="85" y="75" width="30" height="50" rx="2" fill="none" stroke="#b8945a" stroke-width="0.8" opacity="0.2"/>
  
  <!-- Decorative tie-back ribbons with bows -->
  <g opacity="0.6">
    <path d="M 80 80 Q 75 95 80 110" stroke="#b8945a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="77" cy="95" r="3" fill="#b8945a"/>
  </g>
  
  <g opacity="0.6">
    <path d="M 120 80 Q 125 95 120 110" stroke="#d4aa6e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="123" cy="95" r="3" fill="#d4aa6e"/>
  </g>
  
  <!-- Center vertical accent line -->
  <line x1="100" y1="40" x2="100" y2="160" stroke="#d4aa6e" stroke-width="0.5" opacity="0.15"/>
  
  <!-- Bottom border accent -->
  <line x1="32" y1="168" x2="168" y2="168" stroke="#b8945a" stroke-width="0.8" opacity="0.2"/>
</svg>