<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fabricGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4aa6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8945a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fabricGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8945a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4aa6e;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="#f6f5f4" stroke="#b8945a" stroke-width="1.5"/>
  
  <!-- Shadow effect -->
  <g filter="url(#shadow)">
    <!-- Left curtain panel with pleats -->
    <path d="M 40 35 L 40 155 Q 35 165 45 165 L 65 165 Q 70 160 68 150 L 70 40 Q 72 35 65 35 Z" fill="url(#fabricGrad1)"/>
    
    <!-- Pleat details on left -->
    <path d="M 50 40 Q 48 70 49 100 Q 48 130 50 160" stroke="#1f1a17" stroke-width="0.8" opacity="0.3" fill="none"/>
    <path d="M 58 40 Q 56 70 57 100 Q 56 130 58 160" stroke="#1f1a17" stroke-width="0.8" opacity="0.3" fill="none"/>
    
    <!-- Right curtain panel with pleats -->
    <path d="M 160 35 L 160 155 Q 165 165 155 165 L 135 165 Q 130 160 132 150 L 130 40 Q 128 35 135 35 Z" fill="url(#fabricGrad2)"/>
    
    <!-- Pleat details on right -->
    <path d="M 150 40 Q 152 70 151 100 Q 152 130 150 160" stroke="#1f1a17" stroke-width="0.8" opacity="0.3" fill="none"/>
    <path d="M 142 40 Q 144 70 143 100 Q 144 130 142 160" stroke="#1f1a17" stroke-width="0.8" opacity="0.3" fill="none"/>
  </g>
  
  <!-- Curtain rod -->
  <g>
    <rect x="38" y="32" width="124" height="5" rx="2.5" fill="#1f1a17"/>
    <!-- Rod shine -->
    <rect x="38" y="32" width="124" height="2" rx="1" fill="#d4aa6e" opacity="0.6"/>
  </g>
  
  <!-- Center opening with light -->
  <ellipse cx="100" cy="100" rx="25" ry="35" fill="#fff5eb" opacity="0.4"/>
  
  <!-- Decorative ties/knots -->
  <circle cx="65" cy="50" r="3" fill="#b8945a"/>
  <circle cx="135" cy="50" r="3" fill="#b8945a"/>
  <circle cx="60" cy="140" r="3" fill="#d4aa6e"/>
  <circle cx="140" cy="140" r="3" fill="#d4aa6e"/>
  
  <!-- Window frame suggestion -->
  <rect x="80" y="80" width="40" height="40" fill="none" stroke="#d4aa6e" stroke-width="1" opacity="0.3" rx="2"/>
  
  <!-- Center window panes -->
  <line x1="100" y1="80" x2="100" y2="120" stroke="#d4aa6e" stroke-width="0.8" opacity="0.2"/>
  <line x1="80" y1="100" x2="120" y2="100" stroke="#d4aa6e" stroke-width="0.8" opacity="0.2"/>
</svg>