<svg viewBox="0 0 350 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="picIconLeft" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#d4aa6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8945a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="picIconRight" x1="100%" y1="0%" x2="0%">
      <stop offset="0%" style="stop-color:#b8945a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4aa6e;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Icon section -->
  <g transform="translate(8, 20)">
    <!-- Background circle -->
    <circle cx="40" cy="40" r="38" fill="#f6f5f4" stroke="#b8945a" stroke-width="1"/>
    
    <!-- Left curtain -->
    <path d="M 20 15 L 20 65 Q 18 68 24 68 L 38 68 Q 40 65 39 60 L 40 16 Q 41 15 38 15 Z" fill="url(#picIconLeft)"/>
    
    <!-- Left pleats -->
    <path d="M 27 18 Q 26 40 27 62" stroke="#1f1a17" stroke-width="1" opacity="0.25" fill="none" stroke-linecap="round"/>
    <path d="M 34 18 Q 33 40 34 62" stroke="#1f1a17" stroke-width="0.8" opacity="0.15" fill="none" stroke-linecap="round"/>
    
    <!-- Right curtain -->
    <path d="M 60 15 L 60 65 Q 62 68 56 68 L 42 68 Q 40 65 41 60 L 40 16 Q 39 15 42 15 Z" fill="url(#picIconRight)"/>
    
    <!-- Right pleats -->
    <path d="M 53 18 Q 54 40 53 62" stroke="#1f1a17" stroke-width="1" opacity="0.25" fill="none" stroke-linecap="round"/>
    <path d="M 46 18 Q 47 40 46 62" stroke="#1f1a17" stroke-width="0.8" opacity="0.15" fill="none" stroke-linecap="round"/>
    
    <!-- Rod -->
    <rect x="18" y="13" width="44" height="2.5" rx="1.25" fill="#1f1a17"/>
    <rect x="18" y="13" width="44" height="1.2" fill="#d4aa6e" opacity="0.8"/>
    
    <!-- Center glow -->
    <circle cx="40" cy="40" r="10" fill="#fff5eb" opacity="0.4"/>
    
    <!-- Tie-backs -->
    <path d="M 36 30 Q 32 40 36 50" stroke="#b8945a" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M 44 30 Q 48 40 44 50" stroke="#d4aa6e" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
  </g>
  
  <!-- Brand name with styling -->
  <text x="120" y="65" font-family="'Cormorant Garamond', serif" font-size="48" font-weight="600" fill="#1f1a17" letter-spacing="-0.5">LuxeCurtain</text>
  
  <!-- Tagline/descriptor -->
  <text x="120" y="95" font-family="'Inter', sans-serif" font-size="11" font-weight="300" fill="#b8945a" letter-spacing="0.25">PREMIUM INTERIOR STYLING</text>
  
  <!-- Decorative accent line -->
  <line x1="120" y1="102" x2="340" y2="102" stroke="#d4aa6e" stroke-width="1.5" opacity="0.5"/>
</svg>