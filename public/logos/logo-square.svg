<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Square background with subtle gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6f5f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#efefec;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" fill="url(#bgGrad)"/>
  
  <!-- Border -->
  <rect x="8" y="8" width="184" height="184" fill="none" stroke="#b8945a" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Stylized curtain icon -->
  <g transform="translate(50, 50)">
    <!-- Left panel -->
    <path d="M 15 0 L 15 50 Q 12 60 20 65 L 25 65 L 25 50 Q 25 0 15 0 Z" fill="#b8945a" opacity="0.9"/>
    
    <!-- Center gap -->
    <rect x="35" y="0" width="30" height="65" fill="none"/>
    
    <!-- Right panel -->
    <path d="M 85 0 L 85 50 Q 88 60 80 65 L 75 65 L 75 50 Q 75 0 85 0 Z" fill="#d4aa6e" opacity="0.9"/>
    
    <!-- Rod -->
    <rect x="10" y="-2" width="80" height="3" rx="1.5" fill="#1f1a17"/>
    
    <!-- Elegant pleats -->
    <path d="M 25 0 Q 27 20 25 40" stroke="#d4aa6e" stroke-width="1" opacity="0.5" fill="none"/>
    <path d="M 75 0 Q 73 20 75 40" stroke="#b8945a" stroke-width="1" opacity="0.5" fill="none"/>
    
    <!-- Center vertical accent -->
    <line x1="50" y1="10" x2="50" y2="60" stroke="#d4aa6e" stroke-width="0.8" opacity="0.4"/>
  </g>
  
  <!-- Initials or text (optional) -->
  <text x="100" y="175" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#b8945a" letter-spacing="0.1">LC HUB</text>
</svg>