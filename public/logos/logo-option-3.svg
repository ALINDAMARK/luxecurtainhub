<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Elegant geometric curtain design -->
  <defs>
    <linearGradient id="curtainGrad" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#b8945a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4aa6e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left curtain panel -->
  <path d="M 50 60 L 80 60 L 75 100 L 60 140 Q 55 145 50 140 L 50 60 Z" fill="url(#curtainGrad)" opacity="0.8"/>
  
  <!-- Center open space -->
  <rect x="80" y="60" width="40" height="80" fill="none"/>
  
  <!-- Right curtain panel -->
  <path d="M 150 60 L 120 60 L 125 100 L 140 140 Q 145 145 150 140 L 150 60 Z" fill="url(#curtainGrad)" opacity="0.8"/>
  
  <!-- Top rod -->
  <rect x="45" y="55" width="110" height="4" rx="2" fill="#1f1a17"/>
  
  <!-- Center accent -->
  <line x1="100" y1="60" x2="100" y2="140" stroke="#b8945a" stroke-width="1" opacity="0.5"/>
  
  <!-- Decorative dots -->
  <circle cx="100" cy="75" r="2.5" fill="#b8945a"/>
  <circle cx="100" cy="100" r="2.5" fill="#b8945a"/>
  <circle cx="100" cy="125" r="2.5" fill="#b8945a"/>
  
  <!-- Bottom hem accents -->
  <line x1="55" y1="140" x2="65" y2="138" stroke="#d4aa6e" stroke-width="1" opacity="0.6"/>
  <line x1="135" y1="140" x2="145" y2="138" stroke="#d4aa6e" stroke-width="1" opacity="0.6"/>
</svg>