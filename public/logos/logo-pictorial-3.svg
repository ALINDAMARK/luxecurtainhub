<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fabricShine" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#f0ede8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4aa6e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8945a;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background circle gradient -->
  <circle cx="100" cy="100" r="95" fill="#f6f5f4"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#b8945a" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Stylized home/room background -->
  <path d="M 50 50 L 100 25 L 150 50 L 150 155 Q 150 165 140 165 L 60 165 Q 50 165 50 155 Z" 
        fill="none" stroke="#b8945a" stroke-width="1" opacity="0.2"/>
  
  <!-- Left side sheer curtain overlay -->
  <g filter="url(#softShadow)">
    <path d="M 45 45 
             L 45 160
             C 40 165 50 165 60 165
             L 75 165
             Q 80 160 78 155
             L 80 50
             Q 82 45 75 45
             Z" fill="#d4aa6e" opacity="0.85"/>
    
    <!-- Fabric texture lines on left -->
    <path d="M 52 50 Q 50 80 52 110 Q 50 140 52 160" stroke="#b8945a" stroke-width="1.5" opacity="0.3" fill="none" stroke-linecap="round"/>
    <path d="M 60 50 Q 58 80 60 110 Q 58 140 60 160" stroke="#b8945a" stroke-width="1" opacity="0.2" fill="none" stroke-linecap="round"/>
    <path d="M 68 50 Q 66 80 68 110 Q 66 140 68 160" stroke="#1f1a17" stroke-width="0.8" opacity="0.15" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Right side sheer curtain overlay -->
  <g filter="url(#softShadow)">
    <path d="M 155 45 
             L 155 160
             C 160 165 150 165 140 165
             L 125 165
             Q 120 160 122 155
             L 120 50
             Q 118 45 125 45
             Z" fill="#b8945a" opacity="0.9"/>
    
    <!-- Fabric texture lines on right -->
    <path d="M 148 50 Q 150 80 148 110 Q 150 140 148 160" stroke="#d4aa6e" stroke-width="1.5" opacity="0.3" fill="none" stroke-linecap="round"/>
    <path d="M 140 50 Q 142 80 140 110 Q 142 140 140 160" stroke="#d4aa6e" stroke-width="1" opacity="0.2" fill="none" stroke-linecap="round"/>
    <path d="M 132 50 Q 134 80 132 110 Q 134 140 132 160" stroke="#1f1a17" stroke-width="0.8" opacity="0.15" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Window frame with center opening -->
  <rect x="75" y="60" width="50" height="60" rx="4" fill="#f9f7f5" stroke="#b8945a" stroke-width="1.5"/>
  
  <!-- Window panes -->
  <line x1="100" y1="60" x2="100" y2="120" stroke="#b8945a" stroke-width="1" opacity="0.4"/>
  <line x1="75" y1="90" x2="125" y2="90" stroke="#b8945a" stroke-width="1" opacity="0.4"/>
  
  <!-- Light effect in window -->
  <circle cx="100" cy="90" r="12" fill="#fff5eb" opacity="0.6"/>
  
  <!-- Curtain rod -->
  <rect x="45" y="42" width="110" height="3" rx="1.5" fill="#1f1a17"/>
  <circle cx="50" cy="43.5" r="3.5" fill="#1f1a17"/>
  <circle cx="150" cy="43.5" r="3.5" fill="#1f1a17"/>
  
  <!-- Rod accent highlight -->
  <line x1="45" y1="42" x2="155" y2="42" stroke="#d4aa6e" stroke-width="1" opacity="0.7"/>
  
  <!-- Tie-back ropes decorative -->
  <path d="M 75 75 Q 70 90 75 105" stroke="#b8945a" stroke-width="1.2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 125 75 Q 130 90 125 105" stroke="#d4aa6e" stroke-width="1.2" fill="none" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Bottom hem accent -->
  <path d="M 50 158 Q 100 162 150 158" stroke="#b8945a" stroke-width="1" opacity="0.3" fill="none" stroke-linecap="round"/>
</svg>