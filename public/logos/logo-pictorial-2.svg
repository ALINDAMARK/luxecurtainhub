<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="curtainLeft" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" style="stop-color:#d4aa6e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9975e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8945a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="curtainRight" x1="100%" y1="0%" x2="0%">
      <stop offset="0%" style="stop-color:#b8945a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9975e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4aa6e;stop-opacity:0.9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#f6f5f4"/>
  
  <!-- Decorative border -->
  <rect x="5" y="5" width="190" height="190" fill="none" stroke="#b8945a" stroke-width="2" stroke-dasharray="4,4" opacity="0.4" rx="10"/>
  
  <!-- Window frame (background) -->
  <rect x="30" y="25" width="140" height="150" rx="8" fill="#e8e6e3" stroke="#b8945a" stroke-width="1.5"/>
  
  <!-- Light gradient inside window -->
  <defs>
    <radialGradient id="windowLight">
      <stop offset="0%" style="stop-color:#fff9f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0ede8;stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect x="30" y="25" width="140" height="150" fill="url(#windowLight)" rx="8"/>
  
  <!-- Left curtain with elaborate folds -->
  <path d="M 35 30 
           L 35 170
           Q 32 175 38 175
           L 80 175
           Q 85 172 84 165
           L 85 35
           Q 87 30 80 30
           Z" fill="url(#curtainLeft)" filter="url(#glow)"/>
  
  <!-- Left curtain decorative pleats/folds -->
  <path d="M 45 35 Q 43 60 45 90 Q 43 120 45 165" stroke="#8b7355" stroke-width="1.2" opacity="0.4" fill="none"/>
  <path d="M 55 35 Q 52 60 54 90 Q 52 120 55 165" stroke="#8b7355" stroke-width="1" opacity="0.3" fill="none"/>
  <path d="M 65 35 Q 62 60 64 90 Q 62 120 65 165" stroke="#8b7355" stroke-width="1" opacity="0.3" fill="none"/>
  
  <!-- Right curtain with elaborate folds -->
  <path d="M 165 30
           L 165 170
           Q 168 175 162 175
           L 120 175
           Q 115 172 116 165
           L 115 35
           Q 113 30 120 30
           Z" fill="url(#curtainRight)" filter="url(#glow)"/>
  
  <!-- Right curtain decorative pleats/folds -->
  <path d="M 155 35 Q 157 60 155 90 Q 157 120 155 165" stroke="#7a6b5c" stroke-width="1.2" opacity="0.4" fill="none"/>
  <path d="M 145 35 Q 148 60 146 90 Q 148 120 145 165" stroke="#7a6b5c" stroke-width="1" opacity="0.3" fill="none"/>
  <path d="M 135 35 Q 138 60 136 90 Q 138 120 135 165" stroke="#7a6b5c" stroke-width="1" opacity="0.3" fill="none"/>
  
  <!-- Curtain rod with brackets -->
  <rect x="35" y="27" width="130" height="4" rx="2" fill="#1f1a17"/>
  <circle cx="38" cy="29" r="4" fill="#1f1a17" opacity="0.8"/>
  <circle cx="162" cy="29" r="4" fill="#1f1a17" opacity="0.8"/>
  
  <!-- Rod shine/highlight -->
  <rect x="35" y="27" width="130" height="2" rx="1" fill="#d4aa6e" opacity="0.7"/>
  
  <!-- Center light rays -->
  <line x1="100" y1="50" x2="100" y2="160" stroke="#d4aa6e" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Decorative elements (tie-back ribbons) -->
  <path d="M 85 60 Q 95 70 100 75" stroke="#b8945a" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 115 60 Q 105 70 100 75" stroke="#d4aa6e" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Bottom hem detail -->
  <line x1="40" y1="170" x2="160" y2="170" stroke="#8b7355" stroke-width="1" opacity="0.3"/>
</svg>